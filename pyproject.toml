[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brazil-gov-contracts-mcp"
version = "0.6.0"
description = "MCP server for Brazilian federal government contracts (PNCP 2021-2026), CEIS/CNEP sanctions, and Receita Federal CNPJ registry lookup"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "duckdb>=1.1",
    "mcp>=1.12,<2",
]

[project.scripts]
brazil-gov-contracts-mcp = "brazil_gov_contracts.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
